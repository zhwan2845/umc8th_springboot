            client-secret: AxMoGrJK3BGJrQYUezHqWC3WIfeaOOSK
            redirect-uri: http://43.200.177.104:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            scope: profile_nickname
            client-name: Kakao

jwt:
  token:
    secretKey: umceightfightingjwttokenauthentication
